<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Show Grinder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #263b73, transparent 35%),
        radial-gradient(circle at bottom right, #4d1f63, transparent 35%),
        #0c0f17;
      color: #f4f4f4;
      min-height: 100vh;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #b8bfd6;
      margin-top: 4px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
    }

    .panel {
      background: rgba(16, 20, 33, 0.92);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px;
    }

    .stat label {
      display: block;
      color: #aab2cf;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 20px;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #415cff, #8d45ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button.secondary {
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.14);
    }

    button.danger {
      background: linear-gradient(135deg, #b33131, #e15a5a);
    }

    .main-area {
      display: grid;
      gap: 18px;
    }

    .log {
      height: 260px;
      overflow-y: auto;
      background: rgba(0,0,0,0.26);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.45;
      color: #dce2ff;
      font-size: 14px;
    }

    .log p {
      margin: 0 0 10px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 13px;
      min-height: 150px;
      position: relative;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .meta {
      color: #aab2cf;
      font-size: 13px;
      margin: 4px 0;
    }

    .value {
      font-size: 20px;
      margin-top: 8px;
      font-weight: bold;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      background: #2b3352;
      color: #dce2ff;
    }

    .Common { border-color: rgba(180,180,180,0.25); }
    .Uncommon { border-color: rgba(85,190,125,0.5); }
    .Rare { border-color: rgba(75,130,255,0.7); }
    .Ultra-Rare { border-color: rgba(186,92,255,0.8); }
    .Grail {
      border-color: gold;
      box-shadow: 0 0 24px rgba(255, 215, 0, 0.23);
    }

    .grails {
      display: grid;
      gap: 8px;
    }

    .grail {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
    }

    .owned {
      color: #76ff9d;
      font-weight: bold;
    }

    .missing {
      color: #ffadad;
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      max-width: 520px;
      width: 100%;
      background: #121827;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.16);
      background: #0c0f17;
      color: white;
      margin: 12px 0;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Card Show Grinder</h1>
        <div class="subtitle">Rip packs
